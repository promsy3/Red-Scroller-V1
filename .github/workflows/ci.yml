name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # Job 1: Backend e2e tests (access-control / cross-tenant RLS isolation)
  # ──────────────────────────────────────────────────────────────────────────
  backend-e2e:
    name: "Backend – E2E & Access-Control Tests"
    runs-on: ubuntu-latest

    services:
      # NOTE: env context is NOT available inside the services block —
      # credentials must be hard-coded literals here.
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: redscroller_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_ci_pw
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: "postgresql://postgres:postgres_ci_pw@localhost:5432/redscroller_test"
      DIRECT_URL: "postgresql://postgres:postgres_ci_pw@localhost:5432/redscroller_test"
      # Stub values for NestJS modules that consume these at startup
      RESEND_API_KEY: "re_stub_key_for_ci"
      RESEND_FROM_EMAIL: "ci@example.com"
      CLERK_SECRET_KEY: "sk_test_stub_for_ci"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        working-directory: packages/database
        run: npx prisma generate

      - name: Push database schema (create all tables on fresh DB)
        working-directory: packages/database
        run: npx prisma db push --force-reset --accept-data-loss
        env:
          DATABASE_URL: "postgresql://postgres:postgres_ci_pw@localhost:5432/redscroller_test"

      - name: Apply RLS policies migration
        run: |
          psql "postgresql://postgres:postgres_ci_pw@localhost:5432/redscroller_test" \
            -f packages/database/prisma/migrations/add_rls_policies/migration.sql

      - name: Run backend unit tests
        working-directory: apps/api
        run: npm test -- --passWithNoTests

      - name: Run backend e2e tests (including access-control / cross-tenant RLS isolation)
        working-directory: apps/api
        run: npm run test:e2e

  # ──────────────────────────────────────────────────────────────────────────
  # Job 2: Frontend type-check (Next.js / TypeScript)
  # ──────────────────────────────────────────────────────────────────────────
  frontend-typecheck:
    name: "Frontend – TypeScript Type-Check"
    runs-on: ubuntu-latest

    env:
      # Stub Clerk keys — Next.js needs these at type-gen/build time
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: "pk_test_stub_for_ci"
      CLERK_SECRET_KEY: "sk_test_stub_for_ci"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run frontend type-check
        working-directory: apps/web
        run: npx tsc --noEmit
